# privacy-gate.yml — 服务端隐私门（L2），可挂成 required status check
#
# 为什么单独一个 workflow、而不是塞进 ci.yml：
#   规则集勾的是 **check 名字**（显示为 `privacy-gate / gate`）。塞进 ci.yml 会让
#   它随 `checks` job 改名/改结构而失联 —— 一旦失联，规则集里的必需检查就变成
#   永不放行的死锁（或更糟：悄悄不再约束）。独立 job = 名字稳定。
#
# 为什么是 `--range` 而不是 `--all`：
#   `--all` 是**体检模式**（只报告，除非加 `--strict`，否则 exit 0）。拿它当必需
#   检查 = 一个永远绿的装饰门。真正拦得住的是 `--range`：只看这次要合进去的新增行。
#   这正是 .githooks/README.md §一 里「L2 挡得住上面全部绕过路径」的那一层。
#
# 与 L1（本机钩子）的分工：
#   L1 `--staged` / `--stdin-refs` 挡手滑，但 `--no-verify`、删钩子、网页端提交、
#   另一个没装钩子的克隆都能绕过；L2 绕不过去 —— 这是两者唯一的区别所在。
name: privacy-gate

on:
  pull_request:
    branches: [main]
  # 手动全量体检：--all 只报告不拦，用来随时量「历史欠债」有多大。
  # 有意**不**挂在 push 上：那样它会变成一个永远绿的检查，反而稀释「必需检查」的信号。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 是硬要求：--range 要能解析 base/head 两端的提交，
      # 浅克隆会让 range 解析失败；而门禁对「读不到」是 fail-closed（exit 2），
      # 所以浅克隆不是放行而是恒定红灯。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # 前置哨兵：range 两端必须真的存在。否则下面那条会以 exit 2 失败，
      # 而「range 无效」和「真的检出敏感内容」是两件完全不同的事，不该长得一样。
      - name: Range endpoints must resolve
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE='${{ github.event.pull_request.base.sha }}'
          HEAD='${{ github.event.pull_request.head.sha }}'
          git cat-file -e "${BASE}^{commit}"
          git cat-file -e "${HEAD}^{commit}"
          echo "range = ${BASE}...${HEAD}"

      # 阻断门：扫这次 PR **新增的**内容（机器路径 / 私有 IP / 真实邮箱 / 手机号 /
      # 身份证 / 设备号 / 凭据）。命中即 exit 1 ⇒ 这个 check 变红 ⇒ 规则集拒绝合并。
      - name: Privacy gate over the pull request range
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          node tools/privacy-gate.mjs --range '${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}'

      # 手动触发时才跑：全量体检（只报告不拦），用来量历史欠债。
      - name: Privacy gate full audit (advisory)
        if: github.event_name == 'workflow_dispatch'
        run: node tools/privacy-gate.mjs --all

      # 规则级自测：正例必红、白名单必绿。改规则后必跑（README §五），
      # 放进 CI 是为了让「规则被改坏」不会悄悄通过。
      - name: Rule selftest
        run: node tools/privacy-gate.mjs --selftest
